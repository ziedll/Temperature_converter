<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>
<body>
    <h1>Temperature Converter</h1>
    <h2>Enter the temperature, select units and submit</h2>
    <div class="box">
        <input type="text" id="temp">
        <select name="" id="Unit-debut" class="champ">
            <option value="">From Unit</option>
            <option value="" id="F">Fahrenheit</option>
            <option value="" id="C">Celseus</option>
            <option value="" id="K">Kelvin</option>
            
        </select>
        <select name="" id="Unit-final" class="champ">
            <option value="">To Unit</option>
           <option value="" id="F">Fahrenheit</option>
            <option value="" id="C">Celseus</option>
            <option value="" id="K">Kelvin</option>
        </select>
        <button type="submit" id ="button" class="button" >Convert</button>
    </div>
    <script src="script.js"></script>
</body>
</html>
