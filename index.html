<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>
<body>
    <h1>Temperature Converter</h1>
    <h2>Enter the temperature, select units and submit</h2>
    <div class="box">
        <input type="number" id="temp" placeholder="0.00" step="any">
        <select name="" id="Unit-debut" class="champ">
            <option value="">From Unit</option>
            <option value="F" >Fahrenheit</option>
            <option value="C" >Celseus</option>
            <option value="K" >Kelvin</option>
            
        </select>
        <select name="" id="Unit-final" class="champ">
            <option value="">To Unit</option>
            <option value="F" >Fahrenheit</option>
            <option value="C" >Celseus</option>
            <option value="K" >Kelvin</option>
        </select>
        <input type="text" name="result" id="result">
        <button  id ="button" class="button" >Convert</button>
    </div>
    <script  src="script.js"></script>
</body>
</html>
